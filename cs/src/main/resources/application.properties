spring.application.name = cs
server.port = 8888
#\u6DFB\u52A0AI\u914D\u7F6E
#\u5BC6\u94A5
spring.ai.openai.api-key = sk-your-api-key
#\u63A5\u53E3\u5730\u5740
spring.ai.openai.base-url = https://dashscope.aliyuncs.com/compatible-mode
#\u6307\u5B9A\u6A21\u578B\u7248\u672C
spring.ai.openai.chat.options.model = qwen3.7-plus
#★ \u622A\u5C4F\u89C6\u89C9\u611F\u77E5\uFF1A\u56FE\u7247\u95EE\u7B54\u4F7F\u7528\u7684\u591A\u6A21\u6001\u89C6\u89C9\u6A21\u578B\uFF08\u53EF\u9009 qwen-vl-plus / qwen-vl-max-latest / qwen3-vl-plus \u7B49\uFF09
bailian.vl-model = qwen-vl-plus
#AI\u7684\u4EBA\u8BBE\u53CA\u56DE\u590D\u903B\u8F91\uFF1A\u53D1\u5E03\u7248\u7559\u7A7A\uFF0C\u7531\u6D4B\u8BD5\u8005\u5728\u8BBE\u7F6E\u7A97\u53E3\u81EA\u884C\u586B\u5199
bailian.system-Prompt =

spring.main.headless=false

#★ 天气查询工具的默认城市（用户问天气且未指定城市时使用；请填拼音，中文检索有盲区）
pet.city = Sanming

#★ 方案B：TTS语音合成（阿里百炼 qwen3-tts-instruct-flash）
#密钥：留空=自动复用上面 spring.ai.openai.api-key 的百炼密钥；也可单独填另一个百炼 key
tts.api-key =
#接口地址（DashScope 原生，非 OpenAI 兼容）
tts.url = https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
#合成模型
tts.model = qwen3-tts-instruct-flash
#音色：Cherry/Ethan/Nofish/Jennifer/Ryan/Katerina/Elias 等（详见百炼“支持的音色”文档）；发布版留空由测试者选择
tts.voice =
#指令控制（instruct 系列专属）：用自然语言描述说话风格，如“用温柔耐心的语气说”，留空=不启用
tts.instructions =

#★ 语音识别（方案B1：阿里百炼 qwen3-asr-flash，OpenAI兼容）
#密钥：留空=自动复用上面 spring.ai.openai.api-key 的百炼密钥
asr.api-key = 
#接口地址
asr.url = https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
#识别模型
asr.model = qwen3-asr-flash
#实时识别模型（方案B2，WebSocket流式）
asr.realtime-model = paraformer-realtime-v2

#★ 向量记忆：embedding 模型（OpenAI 兼容 /v1/embeddings 端点，复用对话组 url/key）
#留空=禁用向量检索，记忆回退为全量注入；百炼可用 text-embedding-v3 / v4
memory.embedding-model = text-embedding-v3